name: Update activity graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          repository: kuranez/kuranez
          path: profile
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph SVG
        run: |
          target_file="profile/activity-graph.svg"
          temp_file="$(mktemp)"
          if curl --fail --silent --show-error --location \
            "https://github-readme-activity-graph.vercel.app/graph?username=kuranez&theme=github-compact" \
            --output "$temp_file"; then
            mv "$temp_file" "$target_file"
          else
            rm -f "$temp_file"
            if [ ! -f "$target_file" ]; then
              cat <<'SVG' > "$target_file"
              <svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120" role="img" aria-label="GitHub activity graph unavailable">
                <rect width="100%" height="100%" fill="#0d1117" />
                <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="22">
                  GitHub activity graph is temporarily unavailable
                </text>
              </svg>
              SVG
              echo "Activity graph service unavailable, wrote fallback SVG"
            else
              echo "Activity graph service unavailable, keeping existing profile/activity-graph.svg"
            fi
          fi

      - name: Commit and push changes
        working-directory: profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --cached --quiet || git commit -m "Update activity graph"
          git push
