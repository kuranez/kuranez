name: Update activity graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          repository: kuranez/kuranez
          path: profile
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout activity graph repository
        uses: actions/checkout@v4
        with:
          repository: kuranez/github-readme-activity-graph
          path: activity-graph
          fetch-depth: 0

      - name: Verify profile Git repository
        working-directory: profile
        run: |
          pwd
          git status
          git log -1

      - name: Run activity graph generator
        working-directory: activity-graph
        run: |
          # Replace this command with the actual command
          # provided by github-readme-activity-graph.
          ./generate.sh

      - name: Copy generated files
        run: |
          # Adjust these paths to match the generator's output.
          cp -r activity-graph/dist/* profile/

      - name: Commit and push changes
        working-directory: profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --cached --quiet || git commit -m "Update activity graph"
          git push
