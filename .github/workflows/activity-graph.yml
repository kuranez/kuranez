name: Update activity graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          repository: kuranez/kuranez
          path: profile
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph SVG
        run: |
          curl --fail --silent --show-error --location \
            "https://github-readme-activity-graph.vercel.app/graph?username=kuranez&theme=github-compact" \
            --output profile/activity-graph.svg

      - name: Commit and push changes
        working-directory: profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --cached --quiet || git commit -m "Update activity graph"
          git push
